<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本學期授課單元｜教師設定</title><link rel="stylesheet" href="shared/theme.css"><style>.box{max-width:900px;margin:30px auto}.term{margin:18px 0}.u{display:flex;gap:12px;align-items:flex-start;padding:14px;margin:9px 0;border:1px solid var(--line);border-radius:12px;background:#fff}.u input{width:22px;height:22px}.pct{font-size:2rem;font-weight:900}.note2{padding:12px;border-radius:10px;background:#eff6ff}</style></head><body><main class="wrap box"><p><a href="teacher.html">← 教師教學中心</a></p><section class="card"><p class="kicker">👩‍🏫 教師幕後設定｜目前存在這台瀏覽器</p><h1>⭐ 本學期授課單元</h1><p>請勾選本學期實際上課的單元。學生端不顯示這項設定；教師端會以所選單元的星星與完成狀況整理學期學習統計。</p><div class="note2"><b>幕後統計：</b>每個勾選單元會依學生取得的星星換算完成比例，再整合成教師查看的學期學習進度。未勾選單元仍保留學生的星星、作品與成就紀錄。</div></section><div id="terms"></div></main><script>
const TERMS={11601:[['digital','單元一｜數位時代'],['python','單元二｜進入 Python 的世界'],['platform','單元三｜系統平臺大冒險'],['arduino','5016B｜AIoT 智慧教室守護站']],11602:[['media','單元四｜AI 輔助旅拍／多媒體'],['network','單元五｜網路世界'],['unit6','單元六｜進階資料處理'],['arduino','5016B｜守護站 2.0']]};
function key(t){return 'c116-teacher-score-'+t} function get(t){try{let x=JSON.parse(localStorage.getItem(key(t)));return Array.isArray(x)?x:null}catch(e){return null}} function save(t,a){localStorage.setItem(key(t),JSON.stringify(a))}
function draw(){let r=document.getElementById('terms');r.innerHTML='';Object.entries(TERMS).forEach(([t,units])=>{let selected=get(t); if(selected===null) selected=units.map(x=>x[0]);let sec=document.createElement('section');sec.className='card term';sec.innerHTML='<h2>'+(t==='11601'?'116-1 上學期':'116-2 下學期')+'</h2><div class="list"></div><p class="small soft result"></p><button class="btn" data-all>全部勾選</button> <button class="btn" data-none>全部取消</button>';let list=sec.querySelector('.list');units.forEach(u=>{let l=document.createElement('label');l.className='u';l.innerHTML='<input type="checkbox" value="'+u[0]+'" '+(selected.includes(u[0])?'checked':'')+'><span><b>'+u[1]+'</b><br><small>勾選＝本學期授課；未勾＝不納入本學期整體統計</small></span>';list.appendChild(l)});function sync(){let a=[...list.querySelectorAll('input:checked')].map(x=>x.value);save(t,a);sec.querySelector('.result').textContent=a.length?'目前已選 '+a.length+' 個授課單元。':'目前尚未選擇授課單元。';}list.onchange=sync;sec.querySelector('[data-all]').onclick=()=>{list.querySelectorAll('input').forEach(x=>x.checked=true);sync()};sec.querySelector('[data-none]').onclick=()=>{list.querySelectorAll('input').forEach(x=>x.checked=false);sync()};sync();r.appendChild(sec)})}draw();</script></body></html>
