<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Python 畢旅冒險｜資訊科技闖關</title>
<link rel="stylesheet" href="python-journey.css">
</head>
<body>
<header class="hero">
  <a class="back" href="hub.html">← 回 116-1</a>
  <div class="hero-inner">
    <div class="mascot">🐍</div>
    <div>
      <p class="eyebrow">PYTHON JOURNEY</p>
      <h1>Python 畢旅冒險</h1>
      <p>從第一句話出發，一關一關把程式能力帶上旅程。</p>
    </div>
    <div class="star-box">⭐ <b id="totalStars">0</b> / 30</div>
  </div>
</header>

<main>
<section class="route-head">
  <div>
    <h2>🗺️ 冒險路線</h2>
    <p>每一關都從原本的旅程情境繼續前進；先看懂、動手改、執行，再完成小挑戰。</p>
  </div>
  <button id="resetProgress" class="ghost">重新開始冒險</button>
</section>

<section id="journeyMap" class="journey-map"></section>

<section class="creation-zone">
  <span class="flag">🏁 完成十關之後</span>
  <h2>✨ 我的程式改造基地</h2>
  <p>挑一個你最喜歡的旅程程式，改變角色、數字或規則，再加入一個自己的新功能。</p>
  <div class="creation-grid">
    <article><b>🔧 改造</b><span>換文字、數字、角色或判斷規則</span></article>
    <article><b>🧩 加料</b><span>多一個 input、提示、條件或迴圈</span></article>
    <article><b>🚀 自創</b><span>用學過的能力做自己的小程式</span></article>
  </div>
</section>
</main>

<dialog id="missionDialog">
  <button class="close" id="closeDialog" aria-label="關閉">×</button>
  <div id="missionBody"></div>
</dialog>

<script src="../shared/pyrunner.js"></script>
<script src="content/python-journey.js"></script>
</body>
</html>
